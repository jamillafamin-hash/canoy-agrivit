<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <title>Contact - CANOY AGRIVIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="announcement-bar">✿ Fresh agricultural supplies for beautiful harvests ✿</div>
    
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__brand">
                <span class="nav__logo">🌿</span>
                <span>CANOY AGRIVIT</span>
            </a>
            <button class="nav__toggle" id="navToggle" aria-label="Toggle menu">☰</button>
            <ul class="nav__menu" id="navMenu">
                <li><a href="index.html" class="nav__link">Home</a></li>
                <li><a href="shop.html" class="nav__link">Shop</a></li>
                <li><a href="about.html" class="nav__link">About</a></li>
                <li><a href="contact.html" class="nav__link active">Contact</a></li>
            </ul>
            <a href="cart.html" class="nav__cart">
                <span>🛒</span>
                <span>Cart</span>
                <span class="nav__cart-count">0</span>
            </a>
        </nav>
    </header>

    <section class="section">
        <div class="container">
            <div class="section__header">
                <h2 class="section__title">Contact Us</h2>
                <p class="section__subtitle">Get in touch with us</p>
            </div>
            <div style="max-width: 600px; margin: 0 auto;">
                <form id="contactForm" style="background: var(--white); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
                    <div id="contactSuccess" style="display: none; background: #e8f5e9; color: #2e7d32; padding: 1rem; border-radius: var(--radius); margin-bottom: 1rem;">Message sent successfully! (Demo)</div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.375rem; font-size: 0.875rem;">Name *</label>
                        <input type="text" id="contactName" required style="width: 100%; padding: 0.625rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif;">
                        <div id="contactNameError" style="color: #d32f2f; font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.375rem; font-size: 0.875rem;">Email *</label>
                        <input type="email" id="contactEmail" required style="width: 100%; padding: 0.625rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif;">
                        <div id="contactEmailError" style="color: #d32f2f; font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.375rem; font-size: 0.875rem;">Subject *</label>
                        <input type="text" id="contactSubject" required style="width: 100%; padding: 0.625rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif;">
                        <div id="contactSubjectError" style="color: #d32f2f; font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.375rem; font-size: 0.875rem;">Message *</label>
                        <textarea id="contactMessage" required style="width: 100%; padding: 0.625rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif; resize: vertical; min-height: 100px;"></textarea>
                        <div id="contactMessageError" style="color: #d32f2f; font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                    </div>
                    <button type="submit" class="btn btn--primary" style="width: 100%;">Send Message (Demo)</button>
                    <p style="text-align: center; margin-top: 0.75rem; font-size: 0.8125rem; color: #666;">This form is for demonstration only.</p>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer__bottom">
                <p>&copy; <span id="year5"></span> CANOY AGRIVIT. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('year5').textContent = new Date().getFullYear();
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');
        if (navToggle && navMenu) navToggle.addEventListener('click', function(){ navMenu.classList.toggle('active'); });
        if (typeof updateCartCount === 'function') updateCartCount();
        
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('contactNameError').textContent = '';
            document.getElementById('contactEmailError').textContent = '';
            document.getElementById('contactSubjectError').textContent = '';
            document.getElementById('contactMessageError').textContent = '';
            document.getElementById('contactSuccess').style.display = 'none';
            
            let valid = true;
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const subject = document.getElementById('contactSubject').value.trim();
            const message = document.getElementById('contactMessage').value.trim();
            
            if (!name) { document.getElementById('contactNameError').textContent = 'Required'; valid = false; }
            if (!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) { document.getElementById('contactEmailError').textContent = 'Valid email required'; valid = false; }
            if (!subject) { document.getElementById('contactSubjectError').textContent = 'Required'; valid = false; }
            if (!message) { document.getElementById('contactMessageError').textContent = 'Required'; valid = false; }
            
            if (valid) {
                document.getElementById('contactSuccess').style.display = 'block';
                document.getElementById('contactForm').reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
